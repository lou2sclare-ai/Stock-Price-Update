<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>섹터별 주가 모니터</title>
<style>
:root{--navy:#0b1d3a;--navy2:#173a70;--blue:#2f61d5;--pale:#f5f7fb;--line:#dde5ef;--ink:#142033;--muted:#66758a;--red:#d63031;--green:#13795b;--orange:#b86a00;--white:#fff}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Pretendard,"Noto Sans KR",Arial,sans-serif;color:var(--ink);background:var(--pale)}
.hero{background:linear-gradient(115deg,var(--navy),#183b72);color:#fff;padding:30px max(28px,calc((100vw - 1500px)/2));display:flex;justify-content:space-between;align-items:center;gap:24px}.eyebrow{font-size:12px;letter-spacing:.18em;color:#9fc0ff;font-weight:800}.hero h1{margin:6px 0;font-size:32px}.hero p{margin:0;color:#c9d8ee;font-size:14px}.btn{background:#fff;color:var(--navy);padding:12px 18px;border-radius:10px;text-decoration:none;font-weight:800}
main{max-width:1500px;margin:24px auto;padding:0 22px 40px}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 28px rgba(20,32,51,.06)}.kpi{padding:18px 20px}.kpi span,.label{font-size:12px;color:var(--muted);font-weight:800}.kpi strong{display:block;font-size:25px;margin-top:6px}.pass{color:var(--green)}.review{color:var(--orange)}.fail{color:var(--red)}
.fresh{display:grid;grid-template-columns:1fr 1.4fr;gap:12px;margin-top:12px}.fresh .card{padding:16px 20px}.fresh-head{display:flex;justify-content:space-between;align-items:center;gap:20px}.fresh strong{display:block;font-size:21px;margin-top:4px}.meta{font-size:12px;color:var(--muted);text-align:right;line-height:1.5}.date-dist{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.chip{font-size:11px;padding:5px 8px;border:1px solid var(--line);border-radius:999px;background:#fafcff}.chip b{color:var(--navy)}
.notice{margin-top:14px;background:#fff8e8;border:1px solid #f2d69b;border-radius:12px;padding:12px 15px;color:#755000;font-size:13px}.notice summary{font-weight:800;cursor:pointer}
.panel{margin-top:18px;overflow:hidden}.tabs,.sectors{display:flex;gap:8px;flex-wrap:wrap;padding:16px 16px 0}.sectors{padding-top:12px}.tab,.sector{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 13px;font-weight:800;cursor:pointer}.tab.active,.sector.active{background:var(--navy);color:#fff;border-color:var(--navy)}.sector{font-size:12px;background:#f8faff}.sector small{opacity:.7;margin-left:3px}
.toolbar{display:grid;grid-template-columns:minmax(280px,1fr) 220px 180px;gap:10px;padding:14px 16px}.toolbar input,.toolbar select{border:1px solid var(--line);border-radius:9px;padding:11px 13px;font-size:14px;background:#fff}.table-meta{display:flex;justify-content:space-between;padding:11px 16px;border-top:1px solid #edf1f6;background:#fafcff;color:var(--muted);font-size:12px}.table-wrap{overflow:auto;max-height:68vh;border-top:1px solid var(--line)}table{width:100%;border-collapse:separate;border-spacing:0;min-width:1320px;font-size:13px}th{position:sticky;top:0;background:var(--navy);color:#fff;padding:12px 11px;text-align:left;white-space:nowrap}td{padding:10px 11px;border-bottom:1px solid #edf1f6;white-space:nowrap}tbody tr:nth-child(even){background:#fbfcfe}.num{text-align:right}.company{font-weight:800}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef3fb;color:#28466d;font-size:11px;font-weight:800}.state{font-size:11px;font-weight:800}.safe{color:var(--green)}.preserved,.reference{color:var(--orange)}.error{color:var(--red)}.up{color:var(--red);font-weight:800}.down{color:var(--blue);font-weight:800}.muted{color:var(--muted)}
.pager{display:flex;justify-content:center;align-items:center;gap:8px;padding:14px;border-top:1px solid var(--line)}.pager button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 12px;font-weight:800}.pager button:disabled{opacity:.35}.pager span{min-width:100px;text-align:center;font-size:12px;color:var(--muted)}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}.fresh{grid-template-columns:1fr}.toolbar{grid-template-columns:1fr 1fr}.toolbar input{grid-column:1/-1}}@media(max-width:560px){.hero{flex-direction:column;align-items:flex-start}.toolbar{grid-template-columns:1fr}.toolbar input{grid-column:auto}.fresh-head{display:block}.meta{text-align:left;margin-top:8px}}
</style>
</head>
<body>
<header class="hero"><div><div class="eyebrow">RESEARCH MONITOR</div><h1>섹터별 주가 모니터</h1><p id="updated">데이터 불러오는 중…</p></div><a id="excel" class="btn" target="_blank" rel="noopener">최신 Excel</a></header>
<main>
<section class="kpis"><div class="card kpi"><span>전체 Universe</span><strong id="count">-</strong></div><div class="card kpi"><span>국내 기업</span><strong id="domesticCount">-</strong></div><div class="card kpi"><span>해외 기업</span><strong id="globalCount">-</strong></div><div class="card kpi"><span>데이터 QA</span><strong id="qa">-</strong></div></section>
<section class="fresh"><div class="card"><div class="fresh-head"><div><div class="label">한국 가격 거래일</div><strong id="krDate">-</strong></div><div class="meta" id="krMeta">확인 중…</div></div></div><div class="card"><div class="fresh-head"><div><div class="label">해외 가격 거래일 / 수집상태</div><strong id="globalSummary">-</strong></div><div class="meta" id="globalMeta">확인 중…</div></div><div class="date-dist" id="dateDist"></div></div></section>
<details id="qaNotice" class="notice" hidden><summary id="qaSummary">QA 검토 항목</summary><ul id="qaWarnings"></ul></details>
<section class="panel"><div class="tabs"><button class="tab active" data-region="ALL">전체</button><button class="tab" data-region="KR">국내</button><button class="tab" data-region="GLOBAL">해외</button></div><div class="sectors" id="sectorChips"></div><div class="toolbar"><input id="search" placeholder="회사명 / Ticker 검색"><select id="country"><option value="">전체 국가</option></select><select id="status"><option value="">전체 상태</option><option value="COVERAGE">Coverage</option><option value="NR">NR</option><option value="UNDEFINED">미정</option></select></div><div class="table-meta"><span id="resultText">-</span><span>상승 빨강 · 하락 파랑 · 최신 완료 거래일 기준</span></div><div class="table-wrap"><table><thead><tr><th>섹터</th><th>회사</th><th>국가</th><th>Ticker</th><th>거래소</th><th>상태</th><th class="num">종가</th><th class="num">등락</th><th class="num">등락률</th><th class="num">TP</th><th class="num">Upside</th><th>가격 거래일</th><th>데이터 상태</th></tr></thead><tbody id="rows"></tbody></table></div><div class="pager"><button id="prev">이전</button><span id="pageText">-</span><button id="next">다음</button></div></section>
</main>
<script src="config.js"></script>
<script>
const cfg=window.DASHBOARD_CONFIG;let all=[],qa={},page=1,region='ALL',sector='ALL';const PAGE=100;
const SEC={SHIPBUILDING:'조선',DEFENSE:'방산',POWER_EQUIPMENT:'전력기기',CONSTRUCTION_EQUIPMENT:'건설장비',MACHINERY:'기계'},ORD={SHIPBUILDING:0,DEFENSE:1,POWER_EQUIPMENT:2,CONSTRUCTION_EQUIPMENT:3,MACHINERY:4};
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),isKR=r=>String(r.country||'').toUpperCase()==='KR';
function country(v){return String(v||'').toUpperCase()==='KR'?'대한민국':(v||'-')}function fmt(n,c){if(n===null||n===undefined||n==='')return '-';const x=Number(n),d=Math.abs(x)<10?3:(Math.abs(x)<100?2:0);return new Intl.NumberFormat('ko-KR',{maximumFractionDigits:d}).format(x)+(c?` ${c}`:'')}function pct(n){return n===null||n===undefined?'-':`${Number(n).toFixed(1)}%`}function cls(n){return n===null||n===undefined?'':Number(n)>=0?'up':'down'}
function researchStatus(s){return s==='COVERAGE'?'Coverage':s==='NR'?'NR':'미정'}
function dataState(r){const v=r.data_status||'';if(v==='COMPLETED_NO_COMPARISON_REFERENCE')return ['신규상장·직전 기준값 없음','reference'];if(v==='PRESERVED_OPEN_OR_UNKNOWN')return ['이전 완료 거래일 유지','preserved'];if(v==='PRESERVED_AFTER_FETCH_ERROR')return ['수집 오류·이전값 유지','error'];if(v==='FETCH_ERROR')return ['수집 오류','error'];return ['최신 완료 거래일','safe']}
function kst(iso){try{return new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(iso))+' KST'}catch{return iso||'-'}}
function freshness(){const kr=all.filter(isKR),g=all.filter(r=>!isKR(r));const kd=[...new Set(kr.map(r=>r.price_date).filter(Boolean))].sort().at(-1);const kc=kd?kr.filter(r=>r.price_date===kd).length:0;$('#krDate').textContent=kd||'-';$('#krMeta').textContent=kd?`최신 완료 거래일 · ${kc.toLocaleString('ko-KR')}/${kr.length.toLocaleString('ko-KR')}개 동일 기준일`:'가격 거래일 확인 불가';const dist={};g.forEach(r=>dist[r.price_date||'날짜 미확인']=(dist[r.price_date||'날짜 미확인']||0)+1);const e=Object.entries(dist).sort((a,b)=>String(b[0]).localeCompare(String(a[0])));const dated=g.filter(r=>r.price_date).length,preserved=g.filter(r=>String(r.data_status||'').startsWith('PRESERVED')).length,noRef=Number(qa.missing_return_reference_count||0),lag=Number(qa.global_lagging_price_date_count||0),severe=Number(qa.global_severe_lagging_price_date_count||0);$('#globalSummary').textContent=`거래일 확인 ${dated.toLocaleString('ko-KR')}/${g.length.toLocaleString('ko-KR')}개`;const checks=g.map(r=>r.last_checked_at).filter(Boolean).sort();let meta=`최종 확인 ${checks.length?kst(checks.at(-1)):'-'}`;if(preserved)meta+=` · 이전 완료 거래일 유지 ${preserved.toLocaleString('ko-KR')}개`;if(noRef)meta+=` · 직전 기준값 없음 ${noRef.toLocaleString('ko-KR')}개`;if(lag)meta+=` · 거래소 대비 지연 후보 ${lag.toLocaleString('ko-KR')}개`;if(severe)meta+=` (7일+ ${severe.toLocaleString('ko-KR')}개)`;$('#globalMeta').textContent=meta;$('#dateDist').innerHTML=e.slice(0,8).map(([d,n])=>`<span class="chip"><b>${esc(d)}</b> ${n.toLocaleString('ko-KR')}개</span>`).join('')}
function filtered(){const q=$('#search').value.trim().toLowerCase(),c=$('#country').value,st=$('#status').value;return all.filter(r=>(region==='ALL'||(region==='KR'?isKR(r):!isKR(r)))&&(sector==='ALL'||r.research_sector===sector)&&(!c||r.country===c)&&(!st||r.research_status===st)&&(!q||`${r.company_name} ${r.ticker}`.toLowerCase().includes(q))).sort((a,b)=>(ORD[a.research_sector]??99)-(ORD[b.research_sector]??99)||(isKR(b)-isKR(a))||(Number(b.market_cap||0)-Number(a.market_cap||0))||String(a.company_name||'').localeCompare(String(b.company_name||'')))}
function render(){const f=filtered(),pages=Math.max(1,Math.ceil(f.length/PAGE));if(page>pages)page=pages;const s=f.slice((page-1)*PAGE,page*PAGE);$('#resultText').innerHTML=`검색 결과 <strong>${f.length.toLocaleString('ko-KR')}</strong>개 · 현재 ${s.length}개 표시`;$('#pageText').textContent=`${page} / ${pages}`;$('#prev').disabled=page<=1;$('#next').disabled=page>=pages;$('#rows').innerHTML=s.map(r=>{const u=r.target_price&&r.price?(Number(r.target_price)/Number(r.price)-1)*100:null,[sl,sc]=dataState(r);return `<tr><td><span class="badge">${esc(SEC[r.research_sector]||r.research_sector||'-')}</span></td><td class="company">${esc(r.company_name||'-')}</td><td>${esc(country(r.country))}</td><td>${esc(r.ticker||'-')}</td><td class="muted">${esc(r.exchange||'-')}</td><td>${esc(researchStatus(r.research_status))}</td><td class="num">${fmt(r.price,r.currency)}</td><td class="num ${cls(r.price_change)}">${fmt(r.price_change)}</td><td class="num ${cls(r.price_change_pct)}">${pct(r.price_change_pct)}</td><td class="num">${fmt(r.target_price,r.target_currency)}</td><td class="num ${cls(u)}">${u===null?'-':pct(u)}</td><td>${esc(r.price_date||'날짜 미확인')}</td><td><span class="state ${sc}">${esc(sl)}</span></td></tr>`}).join('')}
function chips(){const counts={ALL:all.length};Object.keys(SEC).forEach(s=>counts[s]=all.filter(r=>r.research_sector===s).length);$('#sectorChips').innerHTML=`<button class="sector active" data-sector="ALL">전체 <small>${counts.ALL}</small></button>`+Object.keys(SEC).map(s=>`<button class="sector" data-sector="${s}">${SEC[s]} <small>${counts[s]||0}</small></button>`).join('');document.querySelectorAll('.sector').forEach(b=>b.onclick=()=>{sector=b.dataset.sector;page=1;document.querySelectorAll('.sector').forEach(x=>x.classList.toggle('active',x===b));render()})}
(async()=>{try{$('#excel').href=cfg.excelUrl;const res=await fetch(cfg.dataUrl,{cache:'no-store'});if(!res.ok)throw new Error(`HTTP ${res.status}`);const d=await res.json();all=d.rows||[];qa=d.qa||{};$('#updated').textContent=`업데이트 ${kst(d.generated_at)} · 조선 · 방산 · 전력기기 · 건설장비 · 기계`;$('#count').textContent=all.length.toLocaleString('ko-KR');const kr=all.filter(isKR).length;$('#domesticCount').textContent=kr.toLocaleString('ko-KR');$('#globalCount').textContent=(all.length-kr).toLocaleString('ko-KR');$('#qa').textContent=qa.status||'-';$('#qa').className=qa.status==='PASS'?'pass':qa.status==='FAIL'?'fail':'review';const w=[...(qa.errors||[]),...(qa.warnings||[])];if(w.length){$('#qaNotice').hidden=false;$('#qaSummary').textContent=`QA ${qa.status}: 검토 항목 ${w.length}건`;$('#qaWarnings').innerHTML=w.slice(0,30).map(x=>`<li>${esc(x)}</li>`).join('')}const cs=[...new Set(all.map(r=>r.country).filter(Boolean))].sort();cs.forEach(v=>$('#country').insertAdjacentHTML('beforeend',`<option value="${esc(v)}">${esc(country(v))}</option>`));chips();freshness();render()}catch(e){$('#updated').textContent='데이터 로드 실패: '+e.message}})();
['search','country','status'].forEach(id=>$('#'+id).addEventListener(id==='search'?'input':'change',()=>{page=1;render()}));document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{region=b.dataset.region;page=1;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));render()});$('#prev').onclick=()=>{if(page>1){page--;render()}};$('#next').onclick=()=>{page++;render()};
</script>
</body></html>
