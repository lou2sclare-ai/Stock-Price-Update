project:
  timezone: Asia/Seoul
  output_excel: output/latest.xlsx
  output_json: data/latest.json
  history_csv: data/history.csv
  universe_csv: data/universe_master.csv
  universe_changes_json: data/universe_changes.json
  qa_json: data/qa_latest.json

research_sectors:
  SHIPBUILDING:
    label_ko: 조선
    naver_industries: [조선]
    global_industry_keywords:
      - shipbuilding
      - ship builder
      - marine engineering
      - naval shipbuilding
  DEFENSE:
    label_ko: 방산
    naver_industries: [우주항공과국방]
    global_industry_keywords:
      - aerospace & defense
      - aerospace and defense
      - defense
  POWER_EQUIPMENT:
    label_ko: 전력기기
    naver_industries: [전기장비, 전기제품]
    global_industry_keywords:
      - electrical products
      - electrical equipment
      - power equipment
      - transformers
      - switchgear
      - grid equipment
  CONSTRUCTION_EQUIPMENT:
    label_ko: 건설장비
    naver_industries: [기계]
    global_industry_keywords:
      - construction machinery
      - heavy construction machinery
      - farm & heavy construction machinery
      - heavy equipment
  MACHINERY:
    label_ko: 기계
    naver_industries: [기계]
    global_industry_keywords:
      - industrial machinery
      - machinery
      - engines
      - turbines

# Pin a company to a research sector/status without editing Python.
# Keys may be TICKER or EXCHANGE:TICKER.
manual_overrides: {}

qa:
  max_abs_daily_change_pct: 40.0
  stale_price_days_warning: 7
  # Universe completeness is more important than forcing every global ticker
  # to have a Yahoo mapping on day one. Missing prices are REVIEW, not publish-blocking.
  hard_fail_on_missing_price: false
  hard_fail_on_duplicate_primary_key: true
  minimum_domestic_universe: 30
  minimum_total_universe: 100

global_discovery_industries:
  - Aerospace & Defense
  - Electrical Products
  - Industrial Machinery
  - Trucks/Construction/Farm Machinery
