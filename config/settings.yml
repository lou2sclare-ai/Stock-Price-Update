# Pin a company to a research sector/status without editing Python.
# Keys may be TICKER or EXCHANGE:TICKER.
manual_overrides: {}

qa:
  max_abs_daily_change_pct: 40.0
  stale_price_days_warning: 7
  # Universe completeness is more important than forcing every global ticker
  # to have a Yahoo mapping on day one. Missing prices are REVIEW, not publish-blocking.
  hard_fail_on_missing_price: false
  hard_fail_on_duplicate_primary_key: true
  minimum_domestic_universe: 30
  minimum_total_universe: 100

global_discovery_industries:
  - Aerospace & Defense
  - Electrical Products
  - Industrial Machinery
  - Trucks/Construction/Farm Machinery
