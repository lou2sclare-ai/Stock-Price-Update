name: Code self-checks

on:
  push:
    branches:
      - main
      - 'fix/**'
    paths:
      - 'src/**'
      - 'tests/**'
      - 'config/**'
      - 'requirements.txt'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'config/**'
      - 'requirements.txt'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: code-self-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q src tests
      - name: Run regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Targeted symbol session probe
        run: |
          python - <<'PY'
          from src.universe import tradingview
          keys = [
              ('TSE', '1909'), ('TSE', '7265'),
              ('BX', 'SHR'), ('BX', 'I3H'), ('BX', 'SN20'), ('BX', 'RIHN'),
              ('TASE', 'AUSA-M'), ('NSE', 'VISDEM'), ('NSE', 'SKYTECH'), ('BSE', 'MHEL'),
          ]
          snapshots = tradingview.fetch_symbol_price_snapshots(keys)
          for key in keys:
              print(key, snapshots.get(key))
          PY
