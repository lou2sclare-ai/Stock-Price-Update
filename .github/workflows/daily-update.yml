name: Daily stock update

on:
  schedule:
    # Morning ALL retries, KST Mon-Fri: 07:17 / 07:47 / 08:17 / 08:47.
    - cron: '17 22 * * 0-4'
    - cron: '47 22 * * 0-4'
    - cron: '17 23 * * 0-4'
    - cron: '47 23 * * 0-4'
    # Afternoon SAFE_REFRESH retries, KST Mon-Fri: 16:20 / 16:50 / 17:20 / 18:20.
    - cron: '20 7 * * 1-5'
    - cron: '50 7 * * 1-5'
    - cron: '20 8 * * 1-5'
    - cron: '20 9 * * 1-5'
  workflow_dispatch:
    inputs:
      scope:
        description: 'Update mode (AUTO is recommended)'
        required: true
        default: AUTO
        type: choice
        options:
          - AUTO
          - ALL
          - SAFE_REFRESH

permissions:
  contents: write

concurrency:
  group: stock-price-update-main
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Resolve safe update scope and deduplicate retries
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_EXPR: ${{ github.event.schedule }}
          MANUAL_SCOPE: ${{ inputs.scope }}
        run: |
          KST_HOUR=$(TZ=Asia/Seoul date +%H)
          KST_MIN=$(TZ=Asia/Seoul date +%M)
          TODAY=$(TZ=Asia/Seoul date +%F)

          if [ "$EVENT_NAME" = "schedule" ]; then
            case "$SCHEDULE_EXPR" in
              '17 22 * * 0-4'|'47 22 * * 0-4'|'17 23 * * 0-4'|'47 23 * * 0-4')
                SCOPE="ALL"
                ;;
              *)
                SCOPE="SAFE_REFRESH"
                ;;
            esac
          else
            SCOPE="${MANUAL_SCOPE:-AUTO}"
            if [ "$SCOPE" = "AUTO" ]; then
              if [ "$KST_HOUR" -lt 9 ]; then
                SCOPE="ALL"
              elif [ "$KST_HOUR" -ge 16 ]; then
                SCOPE="SAFE_REFRESH"
              else
                echo "AUTO manual run blocked during 09:00-15:59 KST to avoid publishing intraday prices."
                exit 3
              fi
            fi
          fi

          if [ "$SCOPE" = "ALL" ] && [ "$KST_HOUR" -ge 9 ]; then
            echo "ALL is unsafe at ${KST_HOUR}:${KST_MIN} KST; skipping."
            echo "SKIP_UPDATE=true" >> "$GITHUB_ENV"
            echo "UPDATE_SCOPE=$SCOPE" >> "$GITHUB_ENV"
            exit 0
          fi

          if [ "$SCOPE" = "SAFE_REFRESH" ] && [ "$KST_HOUR" -lt 16 ]; then
            echo "SAFE_REFRESH is too early; skipping."
            echo "SKIP_UPDATE=true" >> "$GITHUB_ENV"
            echo "UPDATE_SCOPE=$SCOPE" >> "$GITHUB_ENV"
            exit 0
          fi

          if [ "$EVENT_NAME" = "schedule" ] && git log -20 --format=%s | grep -Fq "stock update $TODAY $SCOPE"; then
            echo "$SCOPE already succeeded on $TODAY; skipping retry."
            echo "SKIP_UPDATE=true" >> "$GITHUB_ENV"
          else
            echo "SKIP_UPDATE=false" >> "$GITHUB_ENV"
          fi
          echo "UPDATE_SCOPE=$SCOPE" >> "$GITHUB_ENV"
          echo "Resolved UPDATE_SCOPE=$SCOPE"

      - name: Install dependencies
        if: env.SKIP_UPDATE != 'true'
        run: pip install -r requirements.txt

      - name: Refresh universe on Monday morning, safe ALL manual runs, or first run
        if: env.SKIP_UPDATE != 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          KST_DOW=$(TZ=Asia/Seoul date +%u)
          if [ ! -f data/universe_master.csv ] || { [ "$UPDATE_SCOPE" = "ALL" ] && { [ "$KST_DOW" = "1" ] || [ "$EVENT_NAME" = "workflow_dispatch" ]; }; }; then
            python -m src.universe.build
          fi

      - name: Update prices + QA + outputs
        if: env.SKIP_UPDATE != 'true'
        run: python -m src.main

      - name: Surface QA failure reason
        if: failure() && env.SKIP_UPDATE != 'true'
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          p = Path('data/qa_latest.json')
          if not p.exists():
              print('::error title=Stock QA::QA file was not created; failure occurred before QA output.')
              raise SystemExit(0)
          qa = json.loads(p.read_text(encoding='utf-8'))
          errors = qa.get('errors') or []
          warnings = qa.get('warnings') or []
          print(f"QA status: {qa.get('status')}")
          print(f"Errors: {len(errors)} | Warnings: {len(warnings)}")
          for msg in errors:
              safe = str(msg).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f"::error title=Stock QA blocked publication::{safe}")
          for msg in warnings[:10]:
              safe = str(msg).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f"::warning title=Stock QA review::{safe}")
          summary = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary:
              with open(summary, 'a', encoding='utf-8') as f:
                  f.write('## Stock QA failure details\n\n')
                  f.write(f"**Status:** {qa.get('status')}  \n")
                  f.write(f"**Errors:** {len(errors)} / **Warnings:** {len(warnings)}\n\n")
                  if errors:
                      f.write('### Blocking errors\n')
                      for msg in errors:
                          f.write(f"- {msg}\n")
                  if warnings:
                      f.write('\n### Review warnings\n')
                      for msg in warnings[:20]:
                          f.write(f"- {msg}\n")
          PY

      - name: Preserve QA diagnostics only
        if: failure() && env.SKIP_UPDATE != 'true'
        run: |
          if [ -f data/qa_latest.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/qa_latest.json
            git diff --cached --quiet || git commit -m "chore: QA diagnostic $(TZ=Asia/Seoul date +%F) $UPDATE_SCOPE [skip netlify]"
            git push || true
          fi

      - name: Commit successful outputs
        if: success() && env.SKIP_UPDATE != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/universe_master.csv data/universe_changes.json data/latest.json data/qa_latest.json output/latest.xlsx
          git diff --cached --quiet || git commit -m "chore: stock update $(TZ=Asia/Seoul date +%F) $UPDATE_SCOPE [skip netlify]"
          git push
