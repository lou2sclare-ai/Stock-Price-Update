name: Daily stock update

on:
  schedule:
    # 08:15 KST Mon-Fri: all covered markets are between completed sessions.
    - cron: '15 23 * * 0-4'
    # 16:20 KST Mon-Fri: refresh Korea only after KRX regular close.
    - cron: '20 7 * * 1-5'
  workflow_dispatch:
    inputs:
      scope:
        description: 'Safe update scope (AUTO is recommended)'
        required: true
        default: AUTO
        type: choice
        options:
          - AUTO
          - ALL
          - KR_ONLY

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt

      - name: Resolve safe update scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_EXPR: ${{ github.event.schedule }}
          MANUAL_SCOPE: ${{ inputs.scope }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            if [ "$SCHEDULE_EXPR" = "20 7 * * 1-5" ]; then
              SCOPE="KR_ONLY"
            else
              SCOPE="ALL"
            fi
          else
            SCOPE="${MANUAL_SCOPE:-AUTO}"
            if [ "$SCOPE" = "AUTO" ]; then
              KST_HOUR=$(TZ=Asia/Seoul date +%H)
              if [ "$KST_HOUR" -lt 9 ]; then
                SCOPE="ALL"
              elif [ "$KST_HOUR" -ge 16 ]; then
                SCOPE="KR_ONLY"
              else
                echo "AUTO manual run blocked during 09:00-15:59 KST to avoid publishing intraday prices."
                exit 3
              fi
            fi
          fi
          echo "UPDATE_SCOPE=$SCOPE" >> "$GITHUB_ENV"
          echo "Resolved UPDATE_SCOPE=$SCOPE"

      - name: Refresh universe on Monday morning, safe ALL manual runs, or first run
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          KST_DOW=$(TZ=Asia/Seoul date +%u)
          if [ ! -f data/universe_master.csv ] || { [ "$UPDATE_SCOPE" = "ALL" ] && { [ "$KST_DOW" = "1" ] || [ "$EVENT_NAME" = "workflow_dispatch" ]; }; }; then
            python -m src.universe.build
          fi

      - name: Update prices + QA + outputs
        run: python -m src.main

      - name: Commit successful outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/universe_master.csv data/universe_changes.json data/latest.json data/qa_latest.json output/latest.xlsx
          git diff --cached --quiet || git commit -m "chore: stock update $(TZ=Asia/Seoul date +%F) $UPDATE_SCOPE [skip netlify]"
          git push
