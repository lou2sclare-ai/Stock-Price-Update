name: Daily stock update

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'config/**'
      - '.github/workflows/daily-update.yml'
  schedule:
    # Morning ALL retries, KST Mon-Fri: 06:47 / 07:17 / 07:47 / 08:17 / 08:47.
    - cron: '47 21 * * 0-4'
    - cron: '17 22 * * 0-4'
    - cron: '47 22 * * 0-4'
    - cron: '17 23 * * 0-4'
    - cron: '47 23 * * 0-4'
    # Afternoon SAFE_REFRESH passes, KST Mon-Fri. Each pass is intentional:
    # Asian and Middle-East exchanges close at different times.
    - cron: '20 7 * * 1-5'
    - cron: '50 7 * * 1-5'
    - cron: '20 8 * * 1-5'
    - cron: '20 9 * * 1-5'
    - cron: '20 10 * * 1-5'
    - cron: '20 13 * * 1-5'
  workflow_dispatch:
    inputs:
      scope:
        description: 'Update mode (AUTO is recommended)'
        required: true
        default: AUTO
        type: choice
        options:
          - AUTO
          - ALL
          - SAFE_REFRESH
      refresh_universe:
        description: 'Universe refresh (AUTO=every ALL run; FORCE=refresh now; SKIP=use current)'
        required: true
        default: AUTO
        type: choice
        options:
          - AUTO
          - FORCE
          - SKIP

permissions:
  contents: write

concurrency:
  group: stock-price-update-main
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 30
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Resolve safe update scope and deduplicate retries
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_EXPR: ${{ github.event.schedule }}
          MANUAL_SCOPE: ${{ inputs.scope }}
        run: |
          KST_HOUR=$(TZ=Asia/Seoul date +%H)
          KST_MIN=$(TZ=Asia/Seoul date +%M)
          TODAY=$(TZ=Asia/Seoul date +%F)

          if [ "$EVENT_NAME" = "schedule" ]; then
            case "$SCHEDULE_EXPR" in
              '47 21 * * 0-4'|'17 22 * * 0-4'|'47 22 * * 0-4'|'17 23 * * 0-4'|'47 23 * * 0-4')
                SCOPE="ALL"
                ;;
              *)
                SCOPE="SAFE_REFRESH"
                ;;
            esac
          elif [ "$EVENT_NAME" = "push" ]; then
            # Code/config changes must regenerate today's outputs immediately.
            # Python completed-session guards keep this safe at any KST hour.
            SCOPE="ALL"
          else
            SCOPE="${MANUAL_SCOPE:-AUTO}"
            if [ "$SCOPE" = "AUTO" ]; then
              if [ "$KST_HOUR" -lt 9 ]; then
                SCOPE="ALL"
              elif [ "$KST_HOUR" -ge 16 ]; then
                SCOPE="SAFE_REFRESH"
              else
                echo "AUTO manual run blocked during 09:00-15:59 KST to avoid publishing intraday prices."
                exit 3
              fi
            fi
          fi

          if [ "$SCOPE" = "ALL" ]; then
            echo "ALL remains safe at ${KST_HOUR}:${KST_MIN} KST; completed-close guards run in Python."
          fi

          if [ "$SCOPE" = "SAFE_REFRESH" ] && [ "$KST_HOUR" -lt 16 ]; then
            echo "SAFE_REFRESH is too early; skipping."
            echo "SKIP_UPDATE=true" >> "$GITHUB_ENV"
            echo "UPDATE_SCOPE=$SCOPE" >> "$GITHUB_ENV"
            echo "QA_ATTEMPTED=false" >> "$GITHUB_ENV"
            exit 0
          fi

          # Morning ALL entries are retries for the same closed-market snapshot,
          # so deduplicate them after success. Afternoon SAFE_REFRESH entries are
          # separate passes because Asian exchanges close at different times.
          SHOULD_SKIP=false
          if [ "$EVENT_NAME" = "schedule" ] && [ "$SCOPE" = "ALL" ]; then
            LAST_SUCCESS=$(git log -30 --format='%H%x09%s' | grep -F "stock update $TODAY $SCOPE universe-ok" | head -1 | cut -f1 || true)
            if [ -n "$LAST_SUCCESS" ]; then
              if git diff --quiet "$LAST_SUCCESS"..HEAD -- src config .github/workflows; then
                SHOULD_SKIP=true
              else
                echo "Code/config changed after today's successful $SCOPE update; running retry with the fix."
              fi
            fi
          fi

          if [ "$SHOULD_SKIP" = "true" ]; then
            echo "$SCOPE already succeeded on $TODAY with current code and a healthy universe; skipping retry."
            echo "SKIP_UPDATE=true" >> "$GITHUB_ENV"
          else
            echo "SKIP_UPDATE=false" >> "$GITHUB_ENV"
          fi
          echo "UPDATE_SCOPE=$SCOPE" >> "$GITHUB_ENV"
          echo "QA_ATTEMPTED=false" >> "$GITHUB_ENV"
          echo "Resolved UPDATE_SCOPE=$SCOPE event=$EVENT_NAME schedule=$SCHEDULE_EXPR"

      - name: Install dependencies
        if: env.SKIP_UPDATE != 'true'
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run deterministic self-checks
        if: env.SKIP_UPDATE != 'true'
        run: |
          python -m compileall -q src tests
          python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Refresh universe safely when due
        if: env.SKIP_UPDATE != 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_UNIVERSE_MODE: ${{ inputs.refresh_universe }}
        run: |
          MODE="${MANUAL_UNIVERSE_MODE:-AUTO}"
          SHOULD_REFRESH=false
          REQUIRED_REFRESH=false

          if [ ! -s data/universe_master.csv ]; then
            SHOULD_REFRESH=true
            REQUIRED_REFRESH=true
          elif [ "$MODE" = "FORCE" ]; then
            SHOULD_REFRESH=true
          elif [ "$MODE" = "AUTO" ] && [ "$UPDATE_SCOPE" = "ALL" ] && [ "$EVENT_NAME" != "push" ]; then
            SHOULD_REFRESH=true
          fi

          if [ "$SHOULD_REFRESH" != "true" ]; then
            echo "Universe refresh not due; using the validated existing universe."
            echo "UNIVERSE_REFRESH_STATE=ok" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "Attempting universe refresh (mode=$MODE, required=$REQUIRED_REFRESH)."
          if python -m src.universe.build; then
            echo "UNIVERSE_REFRESH_STATE=ok" >> "$GITHUB_ENV"
            echo "Universe refresh succeeded."
          else
            STATUS=$?
            if [ "$REQUIRED_REFRESH" = "true" ]; then
              echo "::error title=Universe refresh failed::No usable existing universe is available, so the price update cannot continue."
              exit "$STATUS"
            fi

            # build.py validates before writing, but restore tracked universe files
            # defensively in case a later write step was interrupted.
            git restore --source=HEAD -- data/universe_master.csv data/universe_changes.json || true
            echo "UNIVERSE_REFRESH_STATE=fallback" >> "$GITHUB_ENV"
            echo "::warning title=Universe refresh fallback::Universe discovery failed; continuing the price update with the last validated universe. A later retry can refresh it again."
            if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
              {
                echo "## Universe refresh fallback"
                echo
                echo "External universe discovery failed, so this run continues with the last validated universe instead of failing the stock-price update."
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

      - name: Apply confirmed inactive listings
        if: env.SKIP_UPDATE != 'true'
        run: python -m src.universe.inactive

      - name: Update prices + QA + outputs
        if: env.SKIP_UPDATE != 'true'
        run: |
          echo "QA_ATTEMPTED=true" >> "$GITHUB_ENV"
          # Remove the checked-in QA file first. If this run fails before writing
          # a new QA result, the failure reporter will not mistake yesterday's QA
          # for the current run's diagnosis.
          rm -f data/qa_latest.json
          python -m src.main

      - name: Surface current-run failure reason
        if: failure() && env.SKIP_UPDATE != 'true'
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          if os.environ.get('QA_ATTEMPTED', '').lower() != 'true':
              print('::error title=Stock pipeline::The run failed before the current price/QA stage. Check the first failed step above; previous QA is intentionally ignored.')
              raise SystemExit(0)

          p = Path('data/qa_latest.json')
          if not p.exists():
              print('::error title=Stock QA::Current-run QA file was not created; failure occurred before QA output.')
              raise SystemExit(0)

          qa = json.loads(p.read_text(encoding='utf-8'))
          errors = qa.get('errors') or []
          warnings = qa.get('warnings') or []
          print(f"QA status: {qa.get('status')}")
          print(f"Errors: {len(errors)} | Warnings: {len(warnings)}")
          for msg in errors:
              safe = str(msg).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f"::error title=Stock QA blocked publication::{safe}")
          for msg in warnings[:10]:
              safe = str(msg).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f"::warning title=Stock QA review::{safe}")
          summary = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary:
              with open(summary, 'a', encoding='utf-8') as f:
                  f.write('## Stock QA failure details\n\n')
                  f.write(f"**Status:** {qa.get('status')}  \n")
                  f.write(f"**Errors:** {len(errors)} / **Warnings:** {len(warnings)}\n\n")
                  if errors:
                      f.write('### Blocking errors\n')
                      for msg in errors:
                          f.write(f"- {msg}\n")
                  if warnings:
                      f.write('\n### Review warnings\n')
                      for msg in warnings[:20]:
                          f.write(f"- {msg}\n")
          PY

      - name: Preserve current QA diagnostics only
        if: failure() && env.SKIP_UPDATE != 'true'
        run: |
          if [ "$QA_ATTEMPTED" = "true" ] && [ -f data/qa_latest.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/qa_latest.json
            git diff --cached --quiet || git commit -m "chore: QA diagnostic $(TZ=Asia/Seoul date +%F) $UPDATE_SCOPE [skip netlify]"
            git push || true
          fi

      - name: Commit successful outputs
        if: success() && env.SKIP_UPDATE != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          UNIVERSE_TAG="universe-${UNIVERSE_REFRESH_STATE:-ok}"
          git add data/universe_master.csv data/universe_changes.json data/latest.json data/qa_latest.json output/latest.xlsx
          git diff --cached --quiet || git commit -m "chore: stock update $(TZ=Asia/Seoul date +%F) $UPDATE_SCOPE $UNIVERSE_TAG [skip netlify]"
          if ! git push; then
            echo "Push raced with another main-branch update; retrying once with rebase."
            git pull --rebase origin main
            git push
          fi
