name: Daily stock update

on:
  schedule:
    # 08:15 KST Monday-Friday (23:15 UTC Sunday-Thursday).
    - cron: '15 23 * * 0-4'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt

      - name: Refresh universe on Mondays, manual runs, or first run
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          KST_DOW=$(TZ=Asia/Seoul date +%u)
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$KST_DOW" = "1" ] || [ ! -f data/universe_master.csv ]; then
            python -m src.universe.build
          fi

      - name: Update prices + QA + outputs
        run: python -m src.main

      - name: Commit successful outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/universe_master.csv data/universe_changes.json data/latest.json data/qa_latest.json output/latest.xlsx
          git diff --cached --quiet || git commit -m "chore: daily stock update $(TZ=Asia/Seoul date +%F) [skip netlify]"
          git push
